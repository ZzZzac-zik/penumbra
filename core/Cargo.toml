[package]
name = "penumbra-mtk"
version = "2.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://itssho.my/penumbra"
description = """
A library for interacting with MediaTek based devices,
for flashing firmware, readback, bootloader unlocking, and more.
"""
keywords = ["MediaTek", "flashing", "bootloader", "android"]
exclude = ["tests"]

[dependencies]
crc32fast = "1.5.0"
enum_dispatch = "0.3.13"
hex = "0.4.3"
log = "0.4.27"
md5 = { version = "0.8.0", optional = true }
num-bigint = { version = "0.4.6", optional = true }
num-traits = "0.2.19"
num_enum = "0.7.4"
nusb = { version = "0.2.1", optional = true }
rand = { version = "0.9.2", optional = true }
rusb = { version = "0.9.4", optional = true}
serialport = { version = "4.7.3", optional = true }
sha1 = { version = "0.10.6", optional = true }
sha2 = { version = "0.10.9", optional = true }
thiserror = "2.0.17"
uuid = { version = "1.23.0", features = ["v4"] }
wincode = { version = "0.5.1", features = ["derive"] }
penumbra-macros = { version = "0.1.0", path = "penumbra-macros" }
hacc = { git = "https://github.com/shomykohai/hacc", version = "0.1.0", features = ["alloc", "crc32"] }
acon = { git = "https://github.com/shomykohai/acon", branch = "stable", version = "0.1.0" }
memchr = { version = "2.8.1", default-features = false }
simple-xml = "0.1.10"
rust-yaml = "1.1.0"
trait-set = "0.5.0"

[features]
default = ["nusb", "exploits", "localslakeyring", "libusb", "serial"]
libusb = ["rusb"]
serial = ["serialport"]
localslakeyring = ["dep:num-bigint", "dep:rand"]
reenumerate = []
exploits = ["dep:md5", "dep:sha1", "dep:sha2"]
